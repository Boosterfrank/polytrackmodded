name: Deploy to GitHub Pages

# Publishes the repository root as a static site. GitHub Pages cannot run the backend proxy itself;
# pml-config.js points the game at the Cloudflare Worker from proxy/ (see README.md).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the repository's default branch is published (any branch can be deployed by hand).
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: rsync -a --exclude=.git --exclude=.github --exclude=.forgejo --exclude=node_modules --exclude=_site ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
